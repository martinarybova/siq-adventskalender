<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/slavistIQ/-Adventskalender</title>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    color: #222;
    text-align: center;
    padding: 2rem;
    background: url("backdots.png") no-repeat center center fixed;
    background-size: cover;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(2px);
    z-index: -1;
  }

  .logo {
    width: 150px;
    margin-bottom: 10px;
  }

  /* ====== GRID MIT TÜRCHEN ====== */
  .grid {
    display: grid;
    grid-template-columns: repeat(8, 80px); /* feste 8 Spalten */
    grid-auto-rows: 80px;
    gap: 10px;
    justify-content: center;
    margin: 1.5rem auto 2rem;
    grid-auto-flow: dense;
  }

  .door {
    background: #b22222;
    color: white;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 1.2em;
    font-weight: bold;
    user-select: none;
  }

  .door:hover {
    transform: scale(1.05);
    box-shadow: 0 0 12px rgba(255,255,255,0.9);
  }

  .locked {
    background: gray;
    cursor: not-allowed;
    opacity: 0.8;
  }

  /* Türchengrößen */
  .wsmall { grid-column: span 2; grid-row: span 1; }
  .hsmall { grid-column: span 1; grid-row: span 2; background: #b84b49}
  .tiny {grid-column: span 1; grid-row: span 1; background: #820e18}
  .long { grid-column: span 3; grid-row: span 1; font-size: 1.1em; background-color: gray}
  .tall { grid-column: span 1; grid-row: span 3; font-size: 1.1em; background-color: #a3a3a3}
  .big { grid-column: span 2; grid-row: span 2; font-size: 1.2em; padding: 30px 0; background: #a11c1c; }
  .large { grid-column: span 2; grid-row: span 3; font-size: 1.5em; background: #800000; box-shadow: 0 0 20px rgba(255,255,255,0.5); transform: scale(1.05); }

  /* ====== QUIZBEREICH ====== */
  #quiz-box {
    background: white;
    padding: 1rem 1.5rem;
    border-radius: 12px;
    max-width: 400px;
    margin: 0 auto;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .option {
    display: block;
    background: #f5f5f5;
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .option:hover { background: #eee; }
  .correct { background: #8bbba0 !important; }
  .wrong { background: #f9b0b0 !important; }
  .explanation { margin-top: 1rem; }
  
  

  /* Responsive für kleine Bildschirme */
  @media (max-width: 600px) {
    .grid {
      grid-template-columns: repeat(5, 60px);
      grid-auto-rows: 50px;
    }
  }
</style>
</head>
<body>
  <img src="versuchtree.png" alt="Logo" class="logo">
  <h1>/slavistIQ/-Adventskalender</h1>
  <p>Klicken Sie auf das heutige Türchen und testen Sie Ihr Wissen!</p>

  <div class="grid" id="calendar"></div>

  <div id="quiz-box" style="display:none;">
    <h2 id="question"></h2>
    <div id="options"></div>
    <p class="explanation" id="explanation"></p>
  </div>

<script>
  const quizData = {
    1: { question: "Wer ist der <i>Položajnik</i> in der serbischen Weihnachtstradition?", options: ["Der erste Besucher", "Der jüngste Sohn", "Der Priester", "Das älteste Familienmitglied"], correct: 0, explanation: "Der <i>Položajnik</i> ist eine wichtige Figur im serbischen Weihnachtsbrauch: Es ist die erste Person, die am Weihnachtstag das Haus betritt. Man glaubt, dass diese Person Glück, Gesundheit und Erfolg für das kommende Jahr bringt. Oft wird der <i>Položajnik</i> bewusst ausgewählt – jemand, der freundlich und lebensfroh ist. Wenn er hereinkommt, wirft er Stroh oder Weizenkörner auf den Boden und ruft: <i>Hristos se rodi!</i> (,Christus ist geboren!‘). Dafür bekommt er kleine Geschenke oder Süßigkeiten. Der Brauch erinnert daran, dass das Weihnachtsfest nicht nur religiös, sondern auch ein Fest der Gastfreundschaft und des guten Willens ist." },
    2: { question: "Wie viele Kerzen hat ein Adventskranz?", options: ["3","4","5","6"], correct: 1, explanation: "Vier – für jeden Adventssonntag eine Kerze." },
    3: { question: "Ursprungsland des Adventskalenders?", options: ["Frankreich","Deutschland","Finnland","Österreich"], correct: 1, explanation: "Deutschland – Tradition im 19. Jahrhundert erfunden." }
  };

  const calendar = document.getElementById('calendar');
  const quizBox = document.getElementById('quiz-box');
  const qText = document.getElementById('question');
  const optBox = document.getElementById('options');
  const expl = document.getElementById('explanation');
  const now = new Date();
const month = now.getMonth(); // Januar = 0, Dezember = 11
let today = 1;

if (month === 11 && now.getDate() <= 24) { // Dezember, maximal Tag 24
  today = now.getDate();
}

  // Feste Layout-Reihenfolge für 24 Türchen (keine freie Ecke)
  const layout = [
    { day: 10, size: 'hsmall' },
	{ day: 23, size: 'hsmall' },
	{ day: 5, size: 'big' },
    { day: 13, size: 'long' },
	{ day: 8, size: 'tiny' },
	{ day: 20, size: 'tall' },
    { day: 4, size: 'long' },
	{ day: 14, size: 'long' },
	{ day: 7, size: 'hsmall' },
    { day: 24, size: 'large' },
	{ day: 11, size: 'hsmall' },
	{ day: 1, size: 'big' },
    { day: 17, size: 'tiny' },
	{ day: 15, size: 'long' },
	{ day: 2, size: 'tall' },
    { day: 6, size: 'tall' },
	{ day: 18, size: 'hsmall' },
	{ day: 12, size: 'tall' },
    { day: 19, size: 'long' },
	{ day: 9, size: 'hsmall' },
	{ day: 3, size: 'hsmall' },
    { day: 21, size: 'big' },
	{ day: 22, size: 'tiny' },
	{ day: 16, size: 'wsmall' }
  ];

  layout.forEach(item => {
    const door = document.createElement('div');
    door.className = `door ${item.size}`;
    door.textContent = item.day;

    if (item.day > today) door.classList.add('locked');
    else door.onclick = () => openQuiz(item.day);

    calendar.appendChild(door);
  });

  function openQuiz(day) {
    const data = quizData[day];
    if (!data) { alert("Heute ist noch kein Quiz hinterlegt 🎄"); return; }

    quizBox.style.display = 'block';
    qText.innerHTML = data.question;
    optBox.innerHTML = '';
    expl.textContent = '';

    data.options.forEach((opt, idx) => {
  const btn = document.createElement('div');
  btn.className = 'option';
  btn.textContent = opt;

  btn.onclick = () => {
    if (idx === data.correct) {
      btn.classList.add('correct');
      expl.innerHTML = "✅ " + data.explanation;
      // Optional: richtig = alle Buttons deaktivieren
      Array.from(optBox.children).forEach(o => o.onclick = null);
    } else {
      btn.classList.add('wrong');
      expl.innerHTML = "❌ Ups! Versuche es nochmal!";
      // Keine Deaktivierung → andere Buttons bleiben anklickbar
    }
  };

  optBox.appendChild(btn);
});
}
</script>
</body>
</html>
